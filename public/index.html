<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRAMAR — Sistema de Gestão Cultural</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary:     #4c1d95;
      --primary-dk:  #24104f;
      --accent:      #f59e0b;
      --surface:     #ffffff;
      --text:        #0f172a;
      --text2:       #475569;
      --border:      #e2e8f0;
      --bg:          #f6f7fb;
      --r:           16px;
    }

    html, body {
      height: 100%;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dk) 100%);
      padding: 24px;
    }

    .card {
      background: var(--surface);
      border-radius: var(--r);
      padding: 40px 36px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 24px 64px rgba(0,0,0,.25), 0 4px 16px rgba(0,0,0,.12);
    }

    .brand-icon {
      width: 68px;
      height: 68px;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dk) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }

    .brand-icon .ms {
      font-family: 'Material Symbols Rounded';
      font-size: 34px;
      color: #fff;
      line-height: 1;
    }

    .org-name {
      font-size: 19px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.2;
      margin-bottom: 4px;
    }

    .tagline {
      font-size: 11.5px;
      color: var(--text2);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: 24px;
    }

    /* Auth notice */
    .auth-notice {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      background: #fef3c7;
      border: 1px solid #fcd34d;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 24px;
      text-align: left;
    }

    .auth-notice .ms {
      font-family: 'Material Symbols Rounded';
      font-size: 18px;
      color: #92400e;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .auth-notice-text {
      font-size: 12.5px;
      color: #78350f;
      line-height: 1.5;
    }

    .auth-notice-text strong {
      font-weight: 700;
      display: block;
      margin-bottom: 2px;
    }

    /* Botão principal */
    .btn-entrar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 13px 20px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dk) 100%);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: opacity .15s, transform .15s;
      margin-bottom: 12px;
    }

    .btn-entrar:hover { opacity: .9; transform: translateY(-1px); }

    .btn-entrar .ms {
      font-family: 'Material Symbols Rounded';
      font-size: 18px;
    }

    /* Botão trocar conta */
    .btn-trocar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 10px 16px;
      background: transparent;
      color: var(--text2);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: background .15s, border-color .15s;
    }

    .btn-trocar:hover { background: var(--bg); border-color: #cbd5e1; }

    .btn-trocar .ms {
      font-family: 'Material Symbols Rounded';
      font-size: 15px;
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 20px 0;
    }

    .powered {
      font-size: 11px;
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .powered .ms {
      font-family: 'Material Symbols Rounded';
      font-size: 13px;
      color: #94a3b8;
    }

    /* Estado: carregando (após clique) */
    .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2.5px solid rgba(255,255,255,.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .btn-entrar.loading .btn-label { display: none; }
    .btn-entrar.loading .spinner { display: block; }
    .btn-entrar.loading .ms-login { display: none; }
  </style>
</head>
<body>
  <div class="card">

    <div class="brand-icon">
      <span class="ms">museum</span>
    </div>

    <div class="org-name" id="login-org-nome">…</div>
    <div class="tagline">TRAMAR — Sistema de Gestão Cultural</div>

    <div class="auth-notice">
      <span class="ms">info</span>
      <div class="auth-notice-text" id="login-auth-notice">
        <strong>Acesso restrito</strong>
        Carregando configurações…
      </div>
    </div>

    <a id="btn-entrar" class="btn-entrar" href="#" onclick="entrar(event)">
      <span class="ms ms-login">login</span>
      <span class="btn-label">Entrar no sistema</span>
      <div class="spinner"></div>
    </a>

    <a id="btn-trocar" class="btn-trocar" href="#" onclick="trocarConta(event)">
      <span class="ms">manage_accounts</span>
      Trocar conta Google
    </a>

    <div class="divider"></div>

    <div class="powered" id="login-powered">
      <span class="ms">lock</span>
      Sistema de Gestão Cultural
    </div>

  </div>

  <script>
    var TARGET = 'https://script.google.com/a/macros/idm.org.br/s/AKfycbzVKQ8fEMBZquOytumFLsb3dIx3DuIZh1cFYe4ywFCoMUXSFewuhZCpy-V8fjLkbe_j/exec';

    // Preserva query params (ex: ?secao=financeiro)
    var qs = window.location.search;
    var target = TARGET + (qs || '');

    var _dominio = '';

    function entrar(e) {
      e.preventDefault();
      var btn = document.getElementById('btn-entrar');
      btn.classList.add('loading');
      setTimeout(function() { window.location.href = target; }, 350);
    }

    function trocarConta(e) {
      e.preventDefault();
      var loginUrl = 'https://accounts.google.com/AccountChooser'
        + '?continue=' + encodeURIComponent(target)
        + (_dominio ? '&hd=' + encodeURIComponent(_dominio) : '');
      window.location.href = loginUrl;
    }

    // Carrega config pública da org para remover qualquer hardcode desta página
    (function() {
      var cfgUrl = TARGET + '?secao=public_config';
      fetch(cfgUrl)
        .then(function(r) { return r.json(); })
        .then(function(cfg) {
          var elNome    = document.getElementById('login-org-nome');
          var elNotice  = document.getElementById('login-auth-notice');
          var elPowered = document.getElementById('login-powered');
          if (elNome && cfg.nome) elNome.textContent = cfg.nome;
          if (elNotice && cfg.nome) {
            var domMsg = cfg.dominio
              ? 'Use sua conta <strong>@' + cfg.dominio + '</strong> no Google. Se estiver logado com outra conta, clique em "Trocar conta" abaixo.'
              : 'Acesse com a conta Google cadastrada na organização.';
            elNotice.innerHTML = '<strong>Acesso restrito</strong> ' + domMsg;
          }
          if (elPowered && cfg.nome) {
            elPowered.innerHTML = '<span class="ms">lock</span> Acesso exclusivo para colaboradores de ' + cfg.nome;
          }
          if (cfg.dominio) _dominio = cfg.dominio;
          // Aplicar paleta de cores se disponível
          if (cfg.paleta) {
            var r = document.documentElement.style;
            if (cfg.paleta.primaria)      r.setProperty('--brand',       cfg.paleta.primaria);
            if (cfg.paleta.primariaClara) r.setProperty('--brand-light', cfg.paleta.secundaria || cfg.paleta.primariaClara);
          }
          // Logo
          if (cfg.logoUrl) {
            var elIcon = document.querySelector('.brand-icon');
            if (elIcon) elIcon.innerHTML = '<img src="' + cfg.logoUrl + '" alt="' + (cfg.nome||'') + '" style="height:48px;object-fit:contain;">';
          }
        })
        .catch(function() {
          // Sem config disponível — mantém texto neutro
          var elNome = document.getElementById('login-org-nome');
          if (elNome && elNome.textContent === '…') elNome.textContent = 'Sistema';
        });
    })();
  </script>
</body>
</html>
