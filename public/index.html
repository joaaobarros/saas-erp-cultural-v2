<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRAMAR — Sistema de Gestão Cultural</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary:     #4c1d95;
      --primary-dk:  #24104f;
      --accent:      #f59e0b;
      --surface:     #ffffff;
      --text:        #0f172a;
      --text2:       #475569;
      --border:      #e2e8f0;
      --bg:          #f6f7fb;
      --r:           16px;
    }

    html, body {
      height: 100%;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dk) 100%);
      padding: 24px;
    }

    .card {
      background: var(--surface);
      border-radius: var(--r);
      padding: 48px 40px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 24px 64px rgba(0,0,0,.25), 0 4px 16px rgba(0,0,0,.12);
    }

    .brand-icon {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dk) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
    }

    .brand-icon .ms {
      font-family: 'Material Symbols Rounded';
      font-size: 36px;
      color: #fff;
      line-height: 1;
    }

    .org-name {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.2;
      margin-bottom: 4px;
    }

    .tagline {
      font-size: 12px;
      color: var(--text2);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: 36px;
    }

    /* Spinner */
    .spinner-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .status-msg {
      font-size: 14px;
      font-weight: 500;
      color: var(--text2);
      margin-bottom: 28px;
    }

    .accent-bar {
      height: 3px;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--primary) 0%, var(--accent) 100%);
      margin-bottom: 28px;
      animation: progress 2.5s ease-out forwards;
      transform-origin: left;
    }

    @keyframes progress {
      from { transform: scaleX(0); }
      to   { transform: scaleX(1); }
    }

    .fallback {
      font-size: 12px;
      color: var(--text2);
    }

    .fallback a {
      color: var(--primary);
      font-weight: 600;
      text-decoration: none;
    }

    .fallback a:hover { text-decoration: underline; }

    .powered {
      margin-top: 32px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .powered .ms {
      font-family: 'Material Symbols Rounded';
      font-size: 14px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="card">

    <div class="brand-icon">
      <span class="ms">museum</span>
    </div>

    <div class="org-name" id="org-name">CCBJ</div>
    <div class="tagline">TRAMAR — Sistema de Gestão Cultural</div>

    <div class="accent-bar"></div>

    <div class="spinner-wrap">
      <div class="spinner"></div>
    </div>

    <p class="status-msg" id="status">Abrindo o sistema…</p>

    <p class="fallback">
      Se não redirecionar automaticamente,
      <a href="https://script.google.com/a/macros/idm.org.br/s/AKfycbzVKQ8fEMBZquOytumFLsb3dIx3DuIZh1cFYe4ywFCoMUXSFewuhZCpy-V8fjLkbe_j/exec" id="link-direto">
        clique aqui
      </a>
    </p>

    <div class="powered">
      <span class="ms">lock</span>
      Acesso restrito a usuários autorizados
    </div>

  </div>

  <script>
    var TARGET = 'https://script.google.com/a/macros/idm.org.br/s/AKfycbzVKQ8fEMBZquOytumFLsb3dIx3DuIZh1cFYe4ywFCoMUXSFewuhZCpy-V8fjLkbe_j/exec';

    // Preserva query params (ex: ?v=... ou ?page=...)
    var qs = window.location.search;
    if (qs) TARGET += qs;

    // Conta regressiva curta — tempo para a barra de progresso completar
    var msgs = ['Verificando acesso…', 'Carregando módulos…', 'Abrindo o sistema…'];
    var i = 0;
    var el = document.getElementById('status');
    var timer = setInterval(function () {
      i = (i + 1) % msgs.length;
      el.textContent = msgs[i];
    }, 800);

    setTimeout(function () {
      clearInterval(timer);
      window.location.replace(TARGET);
    }, 2500);
  </script>
</body>
</html>
