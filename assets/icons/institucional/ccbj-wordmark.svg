<!-- Centro Cultural Bom Jardim — Logotipo completo (marca + wordmark)
     Cores: amarelo #F5B800 | magenta #8E248A | verde #2A7B40
     Licença: uso institucional CCBJ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 76" role="img" aria-label="Centro Cultural Bom Jardim">
  <title>Centro Cultural Bom Jardim</title>

  <!-- Marca geométrica: 60×68, vertically centered (y offset 4) -->
  <g transform="translate(0,4)">
    <!-- Magenta: corpo esquerdo -->
    <polygon points="0,0 26,0 36,30 24,68 0,68" fill="#8E248A"/>
    <!-- Amarelo: topo direito -->
    <polygon points="26,0 60,0 56,36 36,30" fill="#F5B800"/>
    <!-- Verde: direito e base -->
    <polygon points="60,0 60,68 24,68 36,30 56,36" fill="#2A7B40"/>
  </g>

  <!-- Wordmark -->
  <text x="74" y="20"
        font-family="Arial, Helvetica, sans-serif"
        font-size="10" font-weight="400"
        fill="#6B7280" letter-spacing="1">Centro Cultural</text>
  <text x="74" y="46"
        font-family="'Arial Black', Arial, Helvetica, sans-serif"
        font-size="26" font-weight="900"
        fill="#C05015">Bom</text>
  <text x="74" y="70"
        font-family="'Arial Black', Arial, Helvetica, sans-serif"
        font-size="26" font-weight="900"
        fill="#C05015">Jardim</text>
</svg>
