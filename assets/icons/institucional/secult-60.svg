<!-- Secretaria da Cultura do Estado do Ceará — 60 anos (1966–2026)
     Cor: vermelho #C8312A | Licença: uso institucional CCBJ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 140" role="img" aria-label="Secult Ceará 60 anos">
  <title>Secult Ceará — 60 Anos (1966–2026)</title>

  <!-- Anel externo (o "0" do "60") -->
  <circle cx="90" cy="52" r="44" fill="#C8312A"/>
  <!-- Anel branco intermediário -->
  <circle cx="90" cy="52" r="32" fill="#ffffff"/>
  <!-- Anel interno vermelho -->
  <circle cx="90" cy="52" r="24" fill="#C8312A"/>
  <!-- Centro branco -->
  <circle cx="90" cy="52" r="16" fill="#ffffff"/>

  <!-- Ano "1966" no centro do anel -->
  <text x="90" y="56"
        font-family="Arial, Helvetica, sans-serif"
        font-size="9" font-weight="700"
        fill="#C8312A" text-anchor="middle" letter-spacing="0.5">1966</text>

  <!-- "6" grande à esquerda (se apoia visualmente no anel do "0") -->
  <text x="42" y="82"
        font-family="'Arial Black', Arial, Helvetica, sans-serif"
        font-size="88" font-weight="900"
        fill="#C8312A" text-anchor="middle">6</text>

  <!-- Tracejado/separador decorativo abaixo do "60" -->
  <line x1="8" y1="106" x2="120" y2="106" stroke="#C8312A" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- "secult ce" abaixo -->
  <text x="64" y="124"
        font-family="Arial, Helvetica, sans-serif"
        font-size="18" font-weight="700"
        fill="#C8312A" text-anchor="middle" letter-spacing="3">secult ce</text>
</svg>
