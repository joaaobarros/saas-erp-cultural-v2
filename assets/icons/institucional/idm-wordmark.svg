  <!-- Wordmark: texto à direita do símbolo -->
  <text x="72" y="22"
        font-family="Arial, Helvetica, sans-serif"
        font-size="10.5" font-weight="500"
        fill="#8B8B8B" letter-spacing="2">INSTITUTO_</text>
  <text x="71" y="48"
        font-family="'Arial Black', Arial, Helvetica, sans-serif"
        font-size="27" font-weight="900"
        fill="#1A1A1A" letter-spacing="0.5">DRAGÃO</text>
  <text x="71" y="67"
        font-family="'Arial Black', Arial, Helvetica, sans-serif"
        font-size="27" font-weight="900"
        fill="#1A1A1A" letter-spacing="0.5">DO MAR</text>
</svg>
