<!-- Centro Cultural Bom Jardim — Marca geométrica (símbolo isolado)
     Três formas: amarelo #F5B800 | magenta #8E248A | verde #2A7B40
     Licença: uso institucional CCBJ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 72" role="img" aria-label="Centro Cultural Bom Jardim">
  <title>Centro Cultural Bom Jardim — Marca</title>
  <!-- Forma magenta: corpo principal à esquerda -->
  <polygon points="0,0 26,0 36,30 24,72 0,72" fill="#8E248A"/>
  <!-- Forma amarela: porção superior direita -->
  <polygon points="26,0 60,0 56,36 36,30" fill="#F5B800"/>
  <!-- Forma verde: porção inferior direita -->
  <polygon points="60,0 60,72 24,72 36,30 56,36" fill="#2A7B40"/>
</svg>
