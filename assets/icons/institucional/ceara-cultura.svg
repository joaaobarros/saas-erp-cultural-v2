<!-- Ceará Governo do Estado — Secretaria da Cultura
     Brasão simplificado | Verde #1D6934 | Texto cinza #3D4A5C
     Licença: uso institucional CCBJ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 74" role="img" aria-label="Ceará Governo do Estado — Secretaria da Cultura">
  <title>Ceará Governo do Estado — Secretaria da Cultura</title>

  <!-- ─── Brasão simplificado do Ceará (oval heráldico) ─── -->
  <g transform="translate(2,2)">
    <!-- Escudo oval externo: borda dourada -->
    <ellipse cx="32" cy="36" rx="30" ry="33" fill="#C9A82C"/>
    <!-- Interior verde do escudo -->
    <ellipse cx="32" cy="36" rx="27" ry="30" fill="#1D6934"/>

    <!-- Cruz branca simplificada (elemento central do brasão) -->
    <rect x="29" y="14" width="6" height="44" rx="1.5" fill="#ffffff" opacity="0.9"/>
    <rect x="14" y="32" width="36" height="6" rx="1.5" fill="#ffffff" opacity="0.9"/>

    <!-- Estrela central (Southern Cross / Cruzeiro do Sul — principal símbolo do Ceará) -->
    <circle cx="32" cy="36" r="5" fill="#C9A82C"/>
    <circle cx="32" cy="36" r="3" fill="#ffffff"/>

    <!-- Pequenas estrelas nos quadrantes (Cruzeiro do Sul simplificado) -->
    <circle cx="22" cy="26" r="1.8" fill="#C9A82C"/>
    <circle cx="42" cy="26" r="1.8" fill="#C9A82C"/>
    <circle cx="22" cy="46" r="1.8" fill="#C9A82C"/>
    <circle cx="42" cy="46" r="1.8" fill="#C9A82C"/>

    <!-- Borda inferior do escudo: fita verde escura -->
    <path d="M 5,56 Q 32,72 59,56" stroke="#0F4520" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- ─── Wordmark ─── -->
  <text x="76" y="20"
        font-family="'Arial Black', Arial, Helvetica, sans-serif"
        font-size="26" font-weight="900"
        fill="#3D4A5C" letter-spacing="3">CEARÁ</text>
  <text x="76" y="40"
        font-family="Arial, Helvetica, sans-serif"
        font-size="13" font-weight="700"
        fill="#3D4A5C" letter-spacing="1.2">GOVERNO DO ESTADO</text>
  <text x="76" y="58"
        font-family="Arial, Helvetica, sans-serif"
        font-size="9.5" font-weight="400"
        fill="#6B7280" letter-spacing="1">SECRETARIA DA CULTURA</text>

  <!-- Linha separadora vertical entre brasão e texto -->
  <line x1="70" y1="6" x2="70" y2="68" stroke="#CBD5E1" stroke-width="1.2"/>
</svg>
