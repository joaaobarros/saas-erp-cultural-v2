<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title><?= orgConfig.nome ?> — Acompanhar Protocolo</title>
  <?!= include('shared/btnguard'); ?>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f5f5; color: #212121; min-height: 100vh; }
    .container { max-width: 560px; margin: 0 auto; padding: 32px 16px; }
    .header { text-align: center; margin-bottom: 32px; }
    .header h1 { font-size: 24px; color: #1a237e; margin-bottom: 8px; }
    .header p { color: #757575; font-size: 14px; }
    .card { background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.1); padding: 28px; }
    .grupo { margin-bottom: 20px; }
    label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
    input { width: 100%; padding: 10px 12px; border: 1px solid #e0e0e0; border-radius: 6px; font-size: 14px; }
    input:focus { outline: none; border-color: #1a237e; }
    .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; transition: opacity .15s; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-primario { background: #1a237e; color: #fff; }
    #resultado { display: none; margin-top: 24px; }
    .status-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; }
    .status-pendente    { background: #fff9c4; color: #f57f17; }
    .status-analise     { background: #e8eaf6; color: #1a237e; }
    .status-aprovado    { background: #e8f5e9; color: #2e7d32; }
    .status-recusado    { background: #ffebee; color: #c62828; }
    .status-cancelado   { background: #f5f5f5; color: #757575; }
    .detalhe-linha { display: flex; padding: 10px 0; border-bottom: 1px solid #f5f5f5; font-size: 14px; }
    .detalhe-linha:last-child { border-bottom: none; }
    .detalhe-chave { font-weight: 600; color: #616161; min-width: 140px; }
    #erro { display: none; background: #ffebee; border: 1px solid #ef9a9a; border-radius: 6px; padding: 12px; margin-top: 12px; color: #c62828; font-size: 14px; }
    .link-voltar { display: block; text-align: center; margin-top: 20px; font-size: 14px; color: #1a237e; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1><?= orgConfig.nome ?></h1>
    <p>Acompanhamento de Protocolo</p>
  </div>

  <div class="card">
    <div class="grupo">
      <label>Número do protocolo</label>
      <input type="text" id="campo-protocolo" placeholder="Ex: SOL-ABC123" maxlength="40"
        value="<?= params.protocolo || '' ?>">
    </div>
    <div class="grupo">
      <label>E-mail cadastrado na solicitação</label>
      <input type="email" id="campo-email" placeholder="seu@email.com" autocomplete="email">
    </div>
    <div id="erro"></div>
    <button class="btn btn-primario" id="btn-buscar" onclick="buscarProtocolo()">Consultar</button>

    <div id="resultado">
      <h3 style="margin-bottom:16px; color:#1a237e">Resultado da consulta</h3>
      <div id="detalhe-container"></div>
    </div>
  </div>

  <a class="link-voltar" href="?secao=pauta">← Voltar ao formulário de solicitação</a>
</div>

<script>
  var params = <?= JSON.stringify(params) ?>;

  if (params.protocolo) buscarProtocolo();

  function buscarProtocolo() {
    var protocolo = document.getElementById('campo-protocolo').value.trim().toUpperCase();
    var erroEl    = document.getElementById('erro');
    erroEl.style.display = 'none';

    if (!protocolo || protocolo.length < 4) {
      erroEl.textContent = 'Informe um número de protocolo válido.';
      erroEl.style.display = 'block';
      return;
    }

    var emailVal = document.getElementById('campo-email')
      ? document.getElementById('campo-email').value.trim() : '';

    BtnGuard.wrap('btn-buscar', 'Consultando…', function(done) {
      google.script.run
        .withSuccessHandler(function(resp) {
          done();
          erroEl.style.display = 'none';

          if (!resp || !resp.ok) {
            erroEl.textContent = (resp && resp.error && resp.error.message) || 'Protocolo não encontrado.';
            erroEl.style.display = 'block';
            return;
          }

          var r = resp.data;
          var statusMap = {
            'submetida':             { label: 'Aguardando análise', cls: 'status-pendente' },
            'em_analise':            { label: 'Em análise',         cls: 'status-analise' },
            'aprovada':              { label: 'Aprovado',           cls: 'status-aprovado' },
            'recusada':              { label: 'Recusado',           cls: 'status-recusado' },
            'cancelada':             { label: 'Cancelado',          cls: 'status-cancelado' },
            'aguardando_pagamento':  { label: 'Ag. Pagamento',      cls: 'status-analise' }
          };
          var sm = statusMap[r.status] || { label: r.status, cls: 'status-pendente' };
          var dtEnvio = r.criadoEm
            ? new Date(r.criadoEm).toLocaleDateString('pt-BR') : '—';

          document.getElementById('detalhe-container').innerHTML = [
            { chave: 'Protocolo',    valor: r.protocolo },
            { chave: 'Status',       valor: '<span class="status-badge ' + sm.cls + '">' + sm.label + '</span>' },
            { chave: 'Data envio',   valor: dtEnvio },
            { chave: 'Observação',   valor: r.mensagem }
          ].map(function(l) {
            return '<div class="detalhe-linha"><span class="detalhe-chave">' + l.chave
              + '</span><span>' + l.valor + '</span></div>';
          }).join('');

          document.getElementById('resultado').style.display = 'block';
        })
        .withFailureHandler(function(e) {
          done();
          erroEl.textContent = 'Erro de comunicação: ' + (e.message || e);
          erroEl.style.display = 'block';
        })
        .ctrl_portal_getStatusPauta({ protocolo: protocolo, email: emailVal || protocolo });
    });
  }
</script>
</body>
</html>
