  <defs>
    <filter id="sp-shadow">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
    <style>
      .mapa-bg     { fill:#dde3ea; }
      .mapa-borda  { fill:none; stroke:#8fa0b4; stroke-width:2; }
      .mapa-espaco polygon, .mapa-espaco circle, .mapa-espaco rect {
        fill:#e2e8f0; stroke:#fff; stroke-width:1.5;
        transition:fill .18s ease, opacity .18s ease;
        filter:url(#sp-shadow);
      }
      .mapa-espaco:hover polygon,
      .mapa-espaco:hover circle,
      .mapa-espaco:hover rect { opacity:1; filter:brightness(1.1) url(#sp-shadow); cursor:pointer; }
      .mapa-espaco.selecionado polygon,
      .mapa-espaco.selecionado circle,
      .mapa-espaco.selecionado rect {
        stroke:#fff; stroke-width:3;
        filter:drop-shadow(0 0 7px rgba(0,0,0,.45));
      }
      /* Status */
      .mapa-espaco.s-disponivel polygon,
      .mapa-espaco.s-disponivel circle,
      .mapa-espaco.s-disponivel rect  { fill:#10b981; opacity:.78; }
      .mapa-espaco.s-ocupado polygon,
      .mapa-espaco.s-ocupado circle,
      .mapa-espaco.s-ocupado rect     { fill:#ef4444; opacity:.82; }
      .mapa-espaco.s-em_uso polygon,
      .mapa-espaco.s-em_uso circle,
      .mapa-espaco.s-em_uso rect      { fill:#4c1d95; opacity:.84; }
      .mapa-espaco.s-aguardando polygon,
      .mapa-espaco.s-aguardando circle,
      .mapa-espaco.s-aguardando rect  { fill:#f59e0b; opacity:.78; }
      .mapa-espaco.s-manutencao polygon,
      .mapa-espaco.s-manutencao circle,
      .mapa-espaco.s-manutencao rect  { fill:#94a3b8; opacity:.78; }
      .mapa-espaco.s-bloqueado polygon,
      .mapa-espaco.s-bloqueado circle,
      .mapa-espaco.s-bloqueado rect   { fill:#374151; opacity:.82; }
      .mapa-espaco.s-default polygon,
      .mapa-espaco.s-default circle,
      .mapa-espaco.s-default rect     { fill:#c8d3de; opacity:.68; }
      /* Label numbers */
      .mapa-label {
        font-family:'Google Sans',sans-serif;
        font-size:11px; font-weight:700; fill:#fff;
        text-anchor:middle; dominant-baseline:middle;
        pointer-events:none;
        text-shadow:0 1px 2px rgba(0,0,0,.5);
        paint-order:stroke;
        stroke:#0006; stroke-width:2.5; stroke-linejoin:round;
      }
      .mapa-label-lg { font-size:14px; }
      /* Zone colors (background hint) */
      .zona-publico  { fill:#dbeafe; opacity:.3; }
      .zona-equipes  { fill:#ede9fe; opacity:.3; }
      .zona-tecnico  { fill:#fef3c7; opacity:.3; }
