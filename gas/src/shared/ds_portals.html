<!--
  shared/ds_portals.html — Design System Base para Portais Públicos (v2)
  Incluir em todos os portais usando o helper include com o caminho shared/ds_portals.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet">
<style>
/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   TOKENS
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
:root {
  --p:          var(--cor-primaria, #4f46e5);
  --p-lt:       #e0e7ff;
  --p-dk:       #3730a3;
  --accent:     var(--cor-destaque, #f59e0b);
  --success:    #10b981;
  --error:      #ef4444;
  --warning:    #f59e0b;
  --info:       #3b82f6;

  --bg:         #f1f5f9;
  --surface:    #ffffff;
  --surface2:   #f8fafc;
  --border:     #e2e8f0;
  --border2:    #cbd5e1;

  --text:       #0f172a;
  --text2:      #475569;
  --muted:      #94a3b8;

  --r-sm:       6px;
  --r-md:       10px;
  --r-lg:       16px;
  --r-xl:       24px;
  --sh-sm:      0 1px 3px rgba(0,0,0,.07), 0 1px 2px rgba(0,0,0,.04);
  --sh-md:      0 4px 14px rgba(0,0,0,.07), 0 2px 4px rgba(0,0,0,.04);
  --sh-lg:      0 10px 32px rgba(0,0,0,.09), 0 4px 8px rgba(0,0,0,.05);
  --ease:       cubic-bezier(.4,0,.2,1);
  --fast:       120ms;
  --mid:        200ms;
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   RESET & BASE
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  min-height: 100vh;
}
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 99px; }

/* Material Symbols */
.ms {
  font-family: 'Material Symbols Rounded';
  font-size: 20px; line-height: 1; vertical-align: middle;
  font-variation-settings: 'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24;
  user-select: none; flex-shrink: 0;
}
.ms-sm { font-size: 16px; }
.ms-lg { font-size: 28px; }
.ms-xl { font-size: 40px; }

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   PORTAL LAYOUT
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
.portal-header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  height: 64px;
  display: flex;
  align-items: center;
  gap: 14px;
  box-shadow: var(--sh-sm);
}
.portal-header-logo {
  width: 38px; height: 38px;
  border-radius: var(--r-sm);
  object-fit: contain;
  background: var(--p-lt);
  padding: 4px;
}
.portal-header-logo-placeholder {
  width: 38px; height: 38px;
  border-radius: var(--r-sm);
  background: var(--p-lt);
  color: var(--p);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
}
.portal-header-info {}
.portal-header-nome {
  font-size: 14px; font-weight: 700; color: var(--text);
}
.portal-header-sub {
  font-size: 12px; color: var(--muted);
}

.portal-body {
  max-width: 720px;
  margin: 0 auto;
  padding: 32px 20px;
}
.portal-body-wide {
  max-width: 1080px;
  margin: 0 auto;
  padding: 32px 20px;
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   CARD
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
.card {
  background: var(--surface);
  border-radius: var(--r-lg);
  border: 1px solid var(--border);
  box-shadow: var(--sh-sm);
  padding: 28px;
  margin-bottom: 20px;
}
.card-sm { padding: 20px; }
.card-titulo {
  font-size: 15px; font-weight: 700; color: var(--text);
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 18px;
}
.card-titulo .ms { color: var(--p); }

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   FORM ELEMENTS
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
.fg { margin-bottom: 16px; }
.fg-label {
  display: block;
  font-size: 12px; font-weight: 600;
  color: var(--text2);
  text-transform: uppercase; letter-spacing: .04em;
  margin-bottom: 5px;
}
.fg-label .req { color: var(--error); margin-left: 2px; }
.fg-input {
  width: 100%;
  padding: 10px 13px;
  border: 1.5px solid var(--border);
  border-radius: var(--r-sm);
  font-size: 14px;
  font-family: inherit;
  color: var(--text);
  background: var(--surface);
  outline: none;
  transition: border-color var(--fast) var(--ease),
              box-shadow var(--fast) var(--ease);
}
.fg-input:focus {
  border-color: var(--p);
  box-shadow: 0 0 0 3px rgba(79,70,229,.12);
}
.fg-input::placeholder { color: var(--muted); }
textarea.fg-input { min-height: 100px; resize: vertical; line-height: 1.5; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 520px) { .grid-2 { grid-template-columns: 1fr; } }

/* Checkbox group */
.check-group {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 14px 16px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  margin-bottom: 12px;
  cursor: pointer;
}
.check-group input[type=checkbox] {
  width: 16px; height: 16px;
  accent-color: var(--p);
  margin-top: 2px;
  flex-shrink: 0;
  cursor: pointer;
}
.check-group-label {
  font-size: 13px; color: var(--text2); line-height: 1.5;
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   BUTTONS
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
.btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 10px 20px;
  border-radius: var(--r-sm);
  border: none; cursor: pointer;
  font-size: 14px; font-weight: 600;
  font-family: inherit;
  transition: background var(--fast), box-shadow var(--fast), opacity var(--fast);
  white-space: nowrap;
  text-decoration: none;
}
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-block    { width: 100%; justify-content: center; padding: 12px; }
.btn-primary  { background: var(--p); color: #fff; }
.btn-primary:hover:not(:disabled) {
  background: var(--p-dk);
  box-shadow: 0 4px 14px rgba(79,70,229,.35);
}
.btn-success  { background: var(--success); color: #fff; }
.btn-success:hover:not(:disabled) { background: #059669; }
.btn-danger   { background: var(--error); color: #fff; }
.btn-danger:hover:not(:disabled)  { background: #dc2626; }
.btn-ghost    { background: var(--surface2); color: var(--text2); border: 1.5px solid var(--border); }
.btn-ghost:hover:not(:disabled)   { background: var(--border); color: var(--text); }

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   BADGES
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 9px;
  border-radius: 99px;
  font-size: 11.5px; font-weight: 600;
}
.badge-primary  { background: var(--p-lt);  color: var(--p); }
.badge-success  { background: #d1fae5; color: #065f46; }
.badge-warning  { background: #fef3c7; color: #92400e; }
.badge-error    { background: #fee2e2; color: #991b1b; }
.badge-muted    { background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }
.badge-info     { background: #dbeafe; color: #1e40af; }

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   ALERT BOXES
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
.alert {
  display: flex; gap: 12px; align-items: flex-start;
  padding: 14px 16px;
  border-radius: var(--r-md);
  font-size: 13.5px;
  margin-bottom: 16px;
}
.alert .ms { margin-top: 1px; }
.alert-info    { background: #eff6ff; border: 1px solid #bfdbfe; color: #1e40af; }
.alert-success { background: #f0fdf4; border: 1px solid #86efac; color: #14532d; }
.alert-warning { background: #fffbeb; border: 1px solid #fde68a; color: #78350f; }
.alert-error   { background: #fef2f2; border: 1px solid #fca5a5; color: #7f1d1d; }

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   RESULT / SUCCESS STATE
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
.result-state {
  text-align: center;
  padding: 36px 24px;
  display: none;
}
.result-icon {
  width: 72px; height: 72px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 16px;
  font-size: 36px;
}
.result-icon.success { background: #d1fae5; color: #059669; }
.result-icon.error   { background: #fee2e2; color: #dc2626; }
.result-icon.warning { background: #fef3c7; color: #d97706; }
.result-h { font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
.result-sub { font-size: 14px; color: var(--text2); max-width: 380px; margin: 0 auto; }
.result-code {
  font-size: 28px; font-weight: 700;
  color: var(--p);
  background: var(--p-lt);
  border-radius: var(--r-md);
  padding: 12px 20px;
  display: inline-block;
  letter-spacing: .05em;
  margin: 16px 0;
  font-variant-numeric: tabular-nums;
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   EMAIL CHIP
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
.email-chip {
  display: inline-flex; align-items: center; gap: 8px;
  background: #eff6ff;
  border: 1px solid #bfdbfe;
  border-radius: var(--r-md);
  padding: 8px 14px;
  font-size: 13.5px;
  color: #1d4ed8;
  font-weight: 500;
  margin-bottom: 20px;
  max-width: 100%; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap;
}
</style>
