<!-- ─── dc-icon Web Component ──────────────────────────────────────────── -->
<script>
(function() {
  if (customElements.get('dc-icon')) return;

  customElements.define('dc-icon', class extends HTMLElement {
    static get observedAttributes() { return ['name', 'size', 'color', 'class', 'aria-label', 'title']; }

    connectedCallback() { this._render(); }
    attributeChangedCallback() { if (this.isConnected) this._render(); }

    _render() {
      var name  = this.getAttribute('name') || '';
      var size  = this.getAttribute('size') || '24';
      var color = this.getAttribute('color') || 'currentColor';
      var label = this.getAttribute('aria-label') || this.getAttribute('title') || name;
      var cls   = this.getAttribute('class') || '';

      if (!name) { this.innerHTML = ''; return; }

      var isLogo = name.startsWith('logo-');
      var colorAttr = isLogo ? '' : (' color="' + color + '" style="color:' + color + '"');

      this.innerHTML = [
        '<svg xmlns="http://www.w3.org/2000/svg"',
        '  width="' + size + '" height="' + size + '"',
        '  role="img"',
        '  aria-label="' + _escDcIcon(label) + '"',
        '  focusable="false"',
        (cls ? '  class="' + _escDcIcon(cls) + '"' : ''),
        (colorAttr ? colorAttr : ''),
        '>',
        '  <use href="#dc-' + _escDcIcon(name) + '"/>',
        '</svg>'
      ].filter(Boolean).join('
');
    }
  });

  function _escDcIcon(s) {
    return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  /* dcIcon() — função global para uso sem web component (innerHTML) */
  window.dcIcon = function(name, opts) {
    opts = opts || {};
    var size  = opts.size  || 24;
    var color = opts.color || 'currentColor';
    var cls   = opts.cls   || '';
    var label = opts.label || name;
    var isLogo = (name || '').startsWith('logo-');
    var colorStyle = isLogo ? '' : (' style="color:' + color + '"');
    return '<svg xmlns="http://www.w3.org/2000/svg" width="' + size + '" height="' + size + '"'
      + (cls ? ' class="' + cls + '"' : '')
      + ' role="img" aria-label="' + label + '" focusable="false"'
      + colorStyle + '>'
      + '<use href="#dc-' + name + '"/></svg>';
  };

  /* dcLogo() — atalho para logos institucionais com proporção correta */
  window.dcLogo = function(name, opts) {
    opts = opts || {};
    // Tamanhos padrão por logo (height)
    var heights = {
      'idm-sun': 44, 'idm': 40, 'ccbj-mark': 44, 'ccbj': 40,
      'secult-60': 56, 'ceara-cultura': 40
    };
    var h = opts.height || heights[name] || 40;
    return '<svg xmlns="http://www.w3.org/2000/svg" height="' + h + '"'
      + ' role="img" aria-label="' + (opts.label || name) + '" focusable="false">'
      + '<use href="#dc-logo-' + name + '"/></svg>';
  };
})();
</script>
